<!DOCTYPE html>
<html lang="km" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Flashcards - Complex & Limits</title>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' },
            startup: { pageReady: () => MathJax.startup.defaultPageReady().then(() => { window.mathjaxReady = true; }) }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Inter', 'Battambang', sans-serif; }
        .filter-btn { cursor: pointer; transition: all 0.2s; }
        .filter-btn:hover { background-color: #e0e7ff; color: #4f46e5; }
        .dark .filter-btn:hover { background-color: #312e81; color: #e0e7ff; }
        .filter-btn.active-filter { background-color: #4f46e5; color: white; border-color: #4f46e5; }
        .dark .filter-btn.active-filter { background-color: #6366f1; color: white; border-color: #6366f1; }
        .perspective { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flipped { transform: rotateY(180deg); }
        .transition-transform-custom { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .no-select { user-select: none; -webkit-user-select: none; }
        .card-scroll::-webkit-scrollbar { width: 6px; }
        .card-scroll::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300">

    <div class="w-full max-w-3xl flex flex-col items-center">
        
        <div class="text-center mb-6 w-full">
            <div class="flex justify-between items-center w-full px-2 mb-3">
                <div class="w-10"></div>
                <h1 class="text-2xl md:text-3xl font-bold text-indigo-700 dark:text-indigo-400">គណិតវិទ្យា (ត្រៀមប្រឡង)</h1>
                <button id="theme-toggle" class="p-2 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-amber-300 border border-slate-300 dark:border-slate-700 shadow-sm hover:scale-105 transition-transform" title="ប្ដូរពណ៌ផ្ទៃ (Dark/Light)">
                    <span id="theme-icon">☀️</span>
                </button>
            </div>
            
            <!-- ប៊ូតុងមុខងារចម្រាញ់ (Filter Buttons) -->
            <div class="flex flex-wrap justify-center gap-2 mt-4 w-full">
                <button id="filter-all" class="filter-btn active-filter px-4 py-2 rounded-full font-semibold border text-sm text-indigo-600 dark:text-indigo-300 border-indigo-200 dark:border-slate-700 bg-white dark:bg-slate-800 shadow-sm">ទាំងអស់ (All)</button>
                <button id="filter-complex" class="filter-btn px-4 py-2 rounded-full font-semibold border text-sm text-indigo-600 dark:text-indigo-300 border-indigo-200 dark:border-slate-700 bg-white dark:bg-slate-800 shadow-sm">ចំនួនកុំផ្លិច (Complex)</button>
                <button id="filter-limit" class="filter-btn px-4 py-2 rounded-full font-semibold border text-sm text-indigo-600 dark:text-indigo-300 border-indigo-200 dark:border-slate-700 bg-white dark:bg-slate-800 shadow-sm">លីមីត (Limits)</button>
            </div>

            <div class="flex flex-col md:flex-row justify-between items-center w-full px-4 mt-6 gap-3">
                <span class="text-sm font-semibold text-emerald-600 dark:text-emerald-300 bg-emerald-100 dark:bg-emerald-950/70 dark:border dark:border-emerald-800/60 px-3 py-1.5 rounded-full shadow-sm">ជូនពរប្រឡងជាប់! 🎓</span>

                </div>

                <span id="counter" class="text-sm font-bold text-indigo-600 dark:text-indigo-300 bg-indigo-100 dark:bg-indigo-950/70 dark:border dark:border-indigo-800/60 px-4 py-1.5 rounded-full shadow-sm">សំណួរ -- / --</span>
            </div>
        </div>

        <!-- Flashcard -->
        <div id="flashcard" class="relative w-full h-80 md:h-[26rem] perspective cursor-pointer no-select group">
            <div id="card-inner" class="relative w-full h-full transform-style-3d transition-transform-custom shadow-2xl rounded-2xl">
                
                <!-- Front (Question) -->
                <div class="absolute w-full h-full backface-hidden bg-white dark:bg-slate-800 rounded-2xl border-t-4 border-indigo-500 dark:border-indigo-400 dark:border-x dark:border-b dark:border-slate-700/80 flex flex-col p-6 md:p-8 transition-colors duration-300">

                        <span class="text-xs text-gray-400 dark:text-slate-300 font-medium bg-gray-100 dark:bg-slate-700 px-2 py-1 rounded">ចុចលើកាតដើម្បីមើលចម្លើយ</span>
                    </div>
                    <div class="flex-grow flex items-center justify-center overflow-y-auto card-scroll">
                        <p id="question-text" class="text-xl md:text-2xl text-center leading-relaxed text-gray-800 dark:text-slate-100"></p>
                    </div>
                </div>

                <!-- Back (Answer) -->
                <div class="absolute w-full h-full backface-hidden bg-indigo-600 dark:bg-slate-800 dark:border-t-4 dark:border-emerald-400 dark:border-x dark:border-b dark:border-slate-700 rounded-2xl rotate-y-180 flex flex-col p-4 md:p-6 text-white shadow-inner transition-colors duration-300">

                    <div class="flex-grow flex flex-col overflow-y-auto card-scroll pr-2">
                        <p id="answer-text" class="text-lg md:text-xl font-medium leading-relaxed text-white dark:text-slate-100 w-full h-full"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="w-full flex justify-between items-center mt-8 gap-4 mb-10">
            <button id="prev-btn" class="flex-1 py-3 px-6 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-700 dark:text-slate-200 font-semibold rounded-xl shadow-sm hover:bg-gray-50 dark:hover:bg-slate-700 hover:text-indigo-600 dark:hover:text-indigo-400 disabled:opacity-40 disabled:cursor-not-allowed transition-all active:scale-[0.98]">

                ទៅមុខ &rarr;
            </button>
        </div>
    </div>

        let currentFilter = localStorage.getItem('flashcard_filter_v3') || 'all';
        let filteredCards = [];
        let currentIndex = 0;

        const flashcards = data.map(item => {

                return {
                    category: 'limit',

        const filterBtns = {
            all: document.getElementById('filter-all'),

        const goBtn = document.getElementById('go-btn');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');

        // មុខងារប្ដូរ Dark / Light Mode (កំណត់ Dark Mode ជាលំនាំដើម)
        const savedTheme = localStorage.getItem('flashcard_theme') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            themeIcon.textContent = '🌙';
        } else {
            document.documentElement.classList.add('dark');
            themeIcon.textContent = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('flashcard_theme', isDark ? 'dark' : 'light');
            themeIcon.textContent = isDark ? '☀️' : '🌙';
        });

        function triggerMathJax() {
            if (window.MathJax && window.mathjaxReady) {
                MathJax.typesetPromise([qTextEl, aTextEl]).catch(err => console.error(err.message));
            }
        }

        function updateCardContent(index) {
            if (filteredCards.length === 0) return;
            const card = filteredCards[index];
            qTextEl.innerHTML = card.q;
            aTextEl.innerHTML = card.a;
            counterEl.innerHTML = `សំណួរ ${index + 1} / ${filteredCards.length}`;
            pageInput.value = index + 1;
            pageInput.max = filteredCards.length;
            
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === filteredCards.length - 1;
            triggerMathJax();
        }

        function navigateTo(newIndex) {
            if (newIndex < 0 || newIndex >= filteredCards.length) return;
            currentIndex = newIndex;
            localStorage.setItem('flashcard_index_v3_' + currentFilter, currentIndex);
            
            if (cardInner.classList.contains('flipped')) {
                cardInner.classList.remove('flipped');
                setTimeout(() => updateCardContent(currentIndex), 300);
            } else {
                updateCardContent(currentIndex);
            }
        }

        function jumpToPage() {
            let page = parseInt(pageInput.value);
            if (!isNaN(page) && page >= 1 && page <= filteredCards.length) {
                navigateTo(page - 1);
            } else {
                pageInput.classList.add('ring-2', 'ring-red-500', 'bg-red-50');
                setTimeout(() => pageInput.classList.remove('ring-2', 'ring-red-500', 'bg-red-50'), 600);
                pageInput.value = currentIndex + 1; 
            }
        }

        goBtn.addEventListener('click', (e) => { e.stopPropagation(); jumpToPage(); });
        pageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.stopPropagation(); jumpToPage(); } });
        pageInput.addEventListener('click', (e) => e.stopPropagation());

        function applyFilter(filter) {
            currentFilter = filter;
            localStorage.setItem('flashcard_filter_v3', currentFilter);
            
            Object.values(filterBtns).forEach(btn => {
                btn.classList.remove('active-filter', 'bg-indigo-600', 'text-white');
                btn.classList.add('text-indigo-600');
            });
            filterBtns[filter].classList.remove('text-indigo-600');
            filterBtns[filter].classList.add('active-filter', 'bg-indigo-600', 'text-white');

            filteredCards = filter === 'all' ? flashcards : flashcards.filter(c => c.category === filter);
            
            let savedIndex = parseInt(localStorage.getItem('flashcard_index_v3_' + filter)) || 0;
            if (savedIndex >= filteredCards.length) savedIndex = 0;
            
            currentIndex = savedIndex;
            if (cardInner.classList.contains('flipped')) cardInner.classList.remove('flipped');
            updateCardContent(currentIndex);
        }

        Object.keys(filterBtns).forEach(key => {
            filterBtns[key].addEventListener('click', (e) => { e.stopPropagation(); applyFilter(key); });
        });

        cardContainer.addEventListener('click', () => cardInner.classList.toggle('flipped'));
        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); navigateTo(currentIndex - 1); });
        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); navigateTo(currentIndex + 1); });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                if (currentIndex < filteredCards.length - 1) navigateTo(currentIndex + 1);
            } else if (e.key === 'ArrowLeft') {
                if (currentIndex > 0) navigateTo(currentIndex - 1);
            } else if (e.key === ' ' || e.key === 'Enter') {
                if (document.activeElement !== pageInput) {
                    e.preventDefault(); 
                    cardInner.classList.toggle('flipped');
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => applyFilter(currentFilter));
    </script>
</body>
</html>

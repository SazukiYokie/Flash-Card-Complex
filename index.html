<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Numbers Flashcards</title>

    <!-- Google Fonts for better Khmer rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- MathJax Configuration -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            },
            startup: {
                pageReady: () => {
                    return MathJax.startup.defaultPageReady().then(() => {
                        // Initial typeset is done
                        window.mathjaxReady = true;
                    });
                }
            }
        };
    </script>
    <!-- MathJax CDN -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: 'Inter', 'Battambang', sans-serif;
            background-color: #f0fdfa; /* Soft teal background */
        }

        /* 3D Flip Card Styles */
        .perspective {
            perspective: 1000px;
        }
        
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden; /* Safari support */
        }
        
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .flipped {
            transform: rotateY(180deg);
        }

        /* Smooth transition for the flip */
        .transition-transform-custom {
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        /* Prevent text selection when clicking the card */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Custom scrollbar for long texts inside the card */
        .card-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .card-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 text-slate-800">

    <div class="w-full max-w-2xl flex flex-col items-center">
        
        <!-- Header & Progress Counter -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-teal-800 mb-2 tracking-tight">Math Flashcards</h1>
            <p id="counter" class="text-sm font-semibold text-teal-600 bg-teal-100 px-4 py-1.5 rounded-full inline-block shadow-sm">
                Card 1 of X
            </p>
        </div>

        <!-- Flashcard Container -->
        <div id="flashcard" class="relative w-full h-80 md:h-96 perspective cursor-pointer no-select group">
            
            <!-- Inner Card Wrapper -->
            <div id="card-inner" class="relative w-full h-full transform-style-3d transition-transform-custom shadow-xl rounded-2xl">
                
                <!-- Front of Card (Question) -->
                <div class="absolute w-full h-full backface-hidden bg-white rounded-2xl border-t-4 border-teal-500 flex flex-col p-6 md:p-8">
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100">
                        <span id="question-number" class="text-teal-600 font-bold text-lg">Question 1</span>
                        <span class="text-xs text-gray-400 font-medium">Click to flip</span>
                    </div>
                    <div class="flex-grow flex items-center justify-center overflow-y-auto card-scroll">
                        <p id="question-text" class="text-xl md:text-2xl text-center leading-relaxed text-gray-700">
                            <!-- Question injected here -->
                        </p>
                    </div>
                </div>

                <!-- Back of Card (Answer) -->
                <div class="absolute w-full h-full backface-hidden bg-teal-600 rounded-2xl rotate-y-180 flex flex-col p-6 md:p-8 text-white shadow-[inset_0_0_40px_rgba(0,0,0,0.1)]">
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-teal-400/50">
                        <span class="font-bold text-lg text-teal-50">Answer</span>
                        <span class="text-xs text-teal-200 font-medium opacity-80">Click to flip back</span>
                    </div>
                    <div class="flex-grow flex items-center justify-center overflow-y-auto card-scroll">
                        <p id="answer-text" class="text-2xl md:text-3xl font-semibold text-center leading-relaxed">
                            <!-- Answer injected here -->
                        </p>
                    </div>
                </div>

            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="w-full flex justify-between items-center mt-8 gap-4">
            <button id="prev-btn" class="flex-1 py-3 px-6 bg-white border border-gray-200 text-gray-700 font-semibold rounded-xl shadow-sm hover:bg-gray-50 hover:text-teal-600 disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-200 active:scale-[0.98]">
                &larr; Previous
            </button>
            <button id="next-btn" class="flex-1 py-3 px-6 bg-teal-500 text-white font-semibold rounded-xl shadow-md hover:bg-teal-600 hover:shadow-lg disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-200 active:scale-[0.98]">
                Next &rarr;
            </button>
        </div>

    </div>

    <script>
        // 1. Provided dataset exactly as requested
        const flashcards = [
            // Part 1: សញ្ញាណនៃចំនួនកុំផ្លិច
            { q: "ឯកតានិមិត្ត $i$ ផ្ទៀងផ្ទាត់ទំនាក់ទំនងណា ?", a: "$i^{2}=-1$" },
            { q: "ទម្រង់ពីជគណិតនៃចំនួនកុំផ្លិច (ដែល $a,b$ ជាចំនួនពិត) គឺ ៖", a: "$z=a+bi$" },
            { q: "គេឱ្យ $a, b \\in \\mathbb{R}$ ។ ចំនួនកុំផ្លិចចម្លាស់នៃ $z=a+bi$ គឺ ៖", a: "$\\overline{z}=a-bi$" },
            { q: "គេឱ្យ $a, b \\in \\mathbb{R}$ ។ ចំនួនកុំផ្លិចផ្ទុយនៃ $z=a+bi$ គឺ ៖", a: "$-z=-a-bi$" },
            { q: "គេឱ្យ $a, b \\in \\mathbb{R}$ ។ បើ $z=a+bi$ មាន $b=0$ នោះ $z$ ជា ៖", a: "ចំនួនពិត" },
            { q: "គេឱ្យ $a, b \\in \\mathbb{R}$ ។ បើ $z=a+bi$ មាន $a=0$ និង $b \\ne 0$ នោះ $z$ ជា ៖", a: "ចំនួននិមិត្តសុទ្ធ" },
            { q: "ផ្នែកពិត និងផ្នែកនិមិត្តនៃ $z=-5+2i$ គឺ ៖", a: "$a=-5, b=2$" },
            { q: "ឫសក្នុង $\\mathbb{C}$ នៃសមីការ $x^{2}+25=0$ គឺ ៖", a: "$x=\\pm 5i$" },
            { q: "រកចំនួនពិត $x, y$ បើ $(2x-3)+(y+5)i=7+2i$ ៖", a: "$x=5, y=-3$" },
            { q: "សមីការ $x^{2}+2x+2=0$ មាន $\\Delta^{\\prime}=-1$ ។ ឫសក្នុង $\\mathbb{C}$ គឺ ៖", a: "$x=-1 \\pm i$" },
            { q: "តាមវដ្តស្វ័យគុណនៃ $i$ តម្លៃ $i^3$ ស្មើនឹង ៖", a: "$-i$" },
            { q: "ហេតុអ្វីបានជាគ្មានចំនួនពិត $x$ ដែល $x^{2}=-1$?", a: "ព្រោះការេនៃចំនួនពិតគ្រប់ចំនួនធំជាង ឬស្មើសូន្យ" },
            { q: "ទំនាក់ទំនង $\\mathbb{R} \\subset \\mathbb{C}$ មានន័យថា ៖", a: "ចំនួនពិតគ្រប់ចំនួនជាចំនួនកុំផ្លិច" },
            { q: "តម្លៃនៃ $i^{2026}$ គឺ ៖", a: "$-1$" },
            { q: "ចូរបង្កើតចំនួននិមិត្តសុទ្ធ $z$ ដែល $z^{2}=-49$ និង $Im(z)>0$ ៖", a: "$7i$" },

            // Part 2: ប្រមាណវិធីបូក ដក គុណលើចំនួនកុំផ្លិច
            { q: "ក្បួនគុណ $(a+bi)(c+di)$ ស្មើនឹង ៖", a: "$(ac-bd)+(ad+bc)i$" },
            { q: "ហេតុអ្វីផ្នែកពិតនៃផលគុណ $(a+bi)(c+di)$ មានតួ $-bd$?", a: "ព្រោះ $bd i^{2}=-bd$" },
            { q: "ផលបូក $z+\\overline{z}$ ដែល $z=a+bi$ ជានិច្ចជា ៖", a: "ចំនួនពិត $2a$" },
            { q: "គណនា $(2+3i)(4+2i)$ ៖", a: "$2+16i$" },
            { q: "គណនា $(2-i)^{2}$ ៖", a: "$3-4i$" },
            { q: "គណនា $(1+2i)^{2}-i(4+2i)$ ៖", a: "$-1$" },
            { q: "គេឱ្យ $a,b,c,d \\in \\mathbb{R}$ ។ ក្បួនបូក $(a+bi)+(c+di)$ ស្មើនឹង ៖", a: "$(a+c)+(b+d)i$" },
            { q: "ក្បួនដក $(a+bi)-(c+di)$ ស្មើនឹង ៖", a: "$(a-c)+(b-d)i$" },
            { q: "ពេលគុណចំនួនកុំផ្លិចដូចពហុធា គេជំនួស $i^{2}$ ដោយ ៖", a: "$-1$" },
            { q: "ក្នុងប្លង់កុំផ្លិច $z_{1}-z_{2}$ ជាវ៉ិចទ័រ ៖", a: "ពី $z_{2}$ ទៅ $z_{1}$" },
            { q: "គណនា $(5+3i)+(2-i)$ ៖", a: "$7+2i$" },
            { q: "បើ $z=12+7i, w=8-10i$ នោះ $z+w$ ស្មើនឹង ៖", a: "$20-3i$" },
            { q: "គណនា $(-7-3i)+(3+5i)$ ៖", a: "$-4+2i$" },
            { q: "សម្រួល $(1+i+i^{2}+i^{3})+(2+3i)$ ៖", a: "$2+3i$" },
            { q: "ចូរបង្កើតគូ $z, w$ ដែល $z+w$ ជាចំនួនពិត និង $z-w$ ជាចំនួននិមិត្តសុទ្ធ ៖", a: "$z=2+3i, w=2-3i$" },

            // Part 3: វិធីចែក និងលក្ខណៈនៃចំនួនកុំផ្លិចចម្លាស់
            { q: "ផលគុណ $z\\cdot\\overline{z}$ ស្មើនឹង ៖", a: "$a^{2}+b^{2}$" },
            { q: "ផលចែក $\\frac{a+bi}{c+di}$ ស្មើនឹង ៖", a: "$\\frac{ac+bd}{c^{2}+d^{2}}+\\frac{bc-ad}{c^{2}+d^{2}}i$" },
            { q: "ដើម្បីគណនា $\\frac{3}{2+i}$ គេគុណភាគយក និងភាគបែងនឹង ៖", a: "$2-i$" },
            { q: "សរសេរ $\\frac{3}{2+i}$ ជាទម្រង់ពីជគណិត ៖", a: "$\\frac{6}{5}-\\frac{3}{5}i$" },
            { q: "តម្លៃនៃ $\\frac{1}{i}$ គឺ ៖", a: "$-i$" },
            { q: "សម្រួល $\\frac{3-i}{i}$ ៖", a: "$-1-3i$" },
            { q: "សម្រួល $\\frac{(1+i)^{2}}{2-i}$ ៖", a: "$-\\frac{2}{5}+\\frac{4}{5}i$" },
            { q: "លក្ខណៈត្រឹមត្រូវនៃ $\\overline{z_{1}\\cdot z_{2}}$ គឺ ៖", a: "$\\overline{z}_{1}\\cdot\\overline{z}_{2}$" },
            { q: "ចំពោះ $z \\in \\mathbb{C}$ តម្លៃនៃ $\\overline{\\overline{z}}$ គឺ ៖", a: "$z$" },
            { q: "ហេតុអ្វីគេគុណនឹងចម្លាស់នៃភាគបែង ?", a: "ដើម្បីឲ្យភាគបែងក្លាយជាចំនួនពិត" },
            { q: "ទំនាក់ទំនង $\\overline{z_{1}+z_{2}}=\\overline{z}_{1}+\\overline{z}_{2}$ មានន័យថា ៖", a: "ចម្លាស់នៃផលបូកស្មើផលបូកនៃចម្លាស់" },
            { q: "គណនា $(2+3i)(2-3i)$ ៖", a: "$13$" },
            { q: "សរសេរ $\\frac{2}{1+i}$ ជាទម្រង់ $a+bi$ ៖", a: "$1-i$" },
            { q: "គណនា $(3+4i)(1-i)$ ៖", a: "$7-i$" },
            { q: "ចូរបង្កើតចំនួនកុំផ្លិច $z$ ដែល $\\frac{1}{z}=\\frac{1-2i}{5}$ ៖", a: "$z=1+2i$" },

            // Part 4: ចំនួនកុំផ្លិចក្នុងប្លង់កុំផ្លិច
            { q: "រូបភាពនៃ $z$ និង $\\overline{z}$ ឆ្លុះគ្នាធៀបនឹង ៖", a: "អ័ក្សពិត" },
            { q: "រូបភាពនៃ $z$ និង $-z$ ឆ្លុះគ្នាធៀបនឹង ៖", a: "គល់ $O$" },
            { q: "អាហ្វិកនៃចំណុច $C(-2, -3)$ គឺ ៖", a: "$-2-3i$" },
            { q: "បើ $A(z_1), B(z_2), C(z_1+z_2)$, ចតុកោណ $OACB$ ជា ៖", a: "ប្រលេឡូក្រាម" },
            { q: "អាហ្វិកនៃចំណុចកណ្តាល $P$ នៃ $AB$ ដែល $z_{A}=2+6i, z_{B}=4-2i$ គឺ៖", a: "$3+2i$" },
            { q: "ចំនួនកុំផ្លិច $z=a+bi$ ត្រូវតាងដោយចំណុច ៖", a: "$M(a,b)$" },
            { q: "ក្នុងប្លង់កុំផ្លិច អ័ក្ស $(x'Ox)$ ហៅថា ៖", a: "អ័ក្សពិត" },
            { q: "ក្នុងប្លង់កុំផ្លិច អ័ក្ស $(y'Oy)$ ហៅថា ៖", a: "អ័ក្សនិមិត្ត" },
            { q: "ពេលប្រៀបធៀបប្លង់ដេកាតជាមួយប្លង់កុំផ្លិច កូអរដោនេ $(x,y)$ ត្រូវនឹង៖", a: "$(Re(z), Im(z))$" },
            { q: "រូបភាពនៃ $z=3-i$ គឺ៖", a: "$(3,-1)$" },
            { q: "រូបភាពនៃ $z=-4+i$ គឺ៖", a: "$(-4,1)$" },
            { q: "វ៉ិចទ័ររូបភាពនៃ $z=2-3i$ គឺ៖", a: "$\\vec{OM}=(2,-3)$" },
            { q: "$M$ មានអាហ្វិក $3+2i$ ។ ចំណុចឆ្លុះនៃ $M$ ធៀបនឹងគល់ $O$ មានអាហ្វិក ៖", a: "$-3-2i$" },
            { q: "ចំណុចណាស្ថិតនៅខាងស្តាំអ័ក្សនិមិត្ត និងខាងក្រោមអ័ក្សពិត ?", a: "រូបភាពនៃ $3-2i$" },
            { q: "ចូរបង្កើត $z$ ដែលរូបភាពនៅលើអ័ក្សនិមិត្ត ខាងក្រោមគល់ $O$ ចម្ងាយ $4$ ឯកតា ៖", a: "$-4i$" },

            // Part 5: វ៉ិចទ័ររូបភាពនៃផលបូក និងផលដក
            { q: "ប្រវែង $AB$ គណនាដោយរូបមន្ត ៖", a: "$|z_B - z_A|$" },
            { q: "អាហ្វិកនៃវ៉ិចទ័រ $\\vec{AB}$ គឺ ៖", a: "$z_B - z_A$" },
            { q: "អាហ្វិកនៃ $\\vec{AB}$ ដែល $z_A=2+i, z_B=5+5i$ គឺ ៖", a: "$3+4i$" },
            { q: "ប្រវែង $AB$ ដែលមានអាហ្វិក $\\vec{AB}=3+4i$ គឺ ៖", a: "$5$" },
            { q: "ប្រវែង $M_2 M_1$ ពីចំណុច $M_1(4,3)$ និង $M_2(1,-1)$ គឺ ៖", a: "$5$" },
            { q: "បើរូបភាពនៃ $z_{1}, z_{2}$ មិននៅលើបន្ទាត់តែមួយកាត់តាម $O$ វ៉ិចទ័ររូបភាពនៃ $z_{1}+z_{2}$ សង់តាម ៖", a: "ក្បួនប្រលេឡូក្រាម" },
            { q: "បើ $\\vec{OM_{1}}(z_{1})$ និង $\\vec{OM_{2}}(z_{2})$ នោះ $\\vec{OM_{1}}+\\vec{OM_{2}}$ ជាវ៉ិចទ័ររូបភាពនៃ ៖", a: "$z_{1}+z_{2}$" },
            { q: "ផលដក $z_{1}-z_{2}$ អាចសរសេរជា ៖", a: "$z_{1}+(-z_{2})$" },
            { q: "វ៉ិចទ័រដែលតាង $z_{1}-z_{2}$ តាមក្បួនចុងតម្រួតដើម គឺ ៖", a: "$\\vec{M_{2}M_{1}}$" },
            { q: "ក្នុងប្រលេឡូក្រាម $OM_{1}MM_{2}$ វ៉ិចទ័រ $\\vec{OM}$ ជា ៖", a: "អង្កត់ទ្រូងចេញពីគល់ $O$" },
            { q: "រូបភាពនៃ $-z_{2}$ បានមកពីរូបភាពនៃ $z_{2}$ ដោយ ៖", a: "ឆ្លុះធៀបនឹងគល់ $O$" },
            { q: "$z_{1}=2+i, z_{2}=1+2i$ ។ រូបភាពនៃ $z_{1}+z_{2}$ គឺ ៖", a: "$(3,3)$" },
            { q: "$z_{1}=2+i, z_{2}=1+2i$ ។ រូបភាពនៃ $z_{1}-z_{2}$ គឺ ៖", a: "$(1,-1)$" },
            { q: "$z_{1}=4+2i, z_{2}=1+5i$ ។ ផលដក $d=z_{1}-z_{2}$ គឺ ៖", a: "$3-3i$" },
            { q: "បើ $z_{1}=3+i$ ហើយរូបភាពនៃ $z_{1}+z_{2}$ គឺ $(5,2)$ នោះ $z_{2}$ ស្មើនឹង ៖", a: "$2+i$" },

            // Part 6: ម៉ូឌុលនៃចំនួនកុំផ្លិច
            { q: "ម៉ូឌុល $|z|$ នៃ $z=a+bi$ ស្មើនឹង ៖", a: "$\\sqrt{a^2+b^2}$" },
            { q: "បើ $M$ ជាចំណុចរូបភាពនៃ $z$ ក្នុងប្លង់កុំផ្លិច នោះ $|z|$ ជា ៖", a: "ប្រវែង $OM$" },
            { q: "លក្ខណៈត្រឹមត្រូវនៃ $|z_1 z_2|$ គឺ ៖", a: "$|z_1| \\cdot |z_2|$" },
            { q: "វិសមភាពត្រឹមត្រូវគឺ ៖", a: "$|z_1+z_2| \\le |z_1|+|z_2|$" },
            { q: "ហេតុអ្វី $|z|=|\\overline{z}|=|-z|$ ?", a: "ព្រោះ $z$, $\\overline{z}$, និង $-z$ មានផ្នែកពិត និងនិមិត្តខុសតែសញ្ញាពី $z$" },
            { q: "លក្ខខណ្ឌ $|z|=0$ កើតមានកាលណា ៖", a: "$a=0$ និង $b=0$" },
            { q: "ចំពោះចំនួនពិត $a$ ម៉ូឌុលនៃ $z=a$ ស្មើនឹង ៖", a: "$|a|$" },
            { q: "ចំពោះចំនួនពិត $b$ ម៉ូឌុលនៃ $z=bi$ ស្មើនឹង ៖", a: "$|b|$" },
            { q: "គណនា $|6+8i|$ ៖", a: "$10$" },
            { q: "គណនា $|-5+12i|$ ៖", a: "$13$" },
            { q: "គណនា $|\\frac{1}{2}+\\frac{\\sqrt{3}}{2}i|$ ៖", a: "$1$" },
            { q: "គណនា $|-4i|$ ៖", a: "$4$" },
            { q: "គណនា $|(1+i)(2-2i)|$ ៖", a: "$4$" },
            { q: "គណនា $|\\frac{1+i\\sqrt{3}}{1-i}|$ ៖", a: "$\\sqrt{2}$" },
            { q: "ចូរបង្កើត $z$ ដែល $|z|=5, Re(z)=3, Im(z)>0$ ៖", a: "$z=3+4i$" },

            // Part 7: អាគុយម៉ង់នៃចំនួនកុំផ្លិច
            { q: "អាគុយម៉ង់ $\\varphi$ ផ្ទៀងផ្ទាត់ ៖", a: "$\\cos\\varphi=\\frac{a}{r}$ និង $\\sin\\varphi=\\frac{b}{r}$" },
            { q: "បើ $\\varphi$ ជាអាគុយម៉ង់មួយនៃ $z \\neq 0$ នោះគេសរសេរ ៖", a: "$\\arg z=\\varphi+2k\\pi, k \\in \\mathbb{Z}$" },
            { q: "ចំនួនកុំផ្លិចណាគ្មានអាគុយម៉ង់ ?", a: "$z=0$" },
            { q: "អាគុយម៉ង់នៃ $z=a > 0$ គឺ ៖", a: "$2k\\pi$" },
            { q: "ហេតុអ្វី $z=0$ គ្មានអាគុយម៉ង់ ?", a: "ព្រោះ $r=0$ ដូច្នេះ $\\frac{a}{r}$ និង $\\frac{b}{r}$ គ្មានន័យ" },
            { q: "អាគុយម៉ង់នៃ $z=1+i\\sqrt{3}$ ៖", a: "$\\frac{\\pi}{3}+2k\\pi$" },
            { q: "អាគុយម៉ង់នៃ $z=-1+i\\sqrt{3}$ ៖", a: "$\\frac{2\\pi}{3}+2k\\pi$" },
            { q: "អាគុយម៉ង់នៃ $z=-1+i$ ៖", a: "$\\frac{3\\pi}{4}+2k\\pi$" },
            { q: "អាគុយម៉ង់នៃ $z=\\sqrt{3}+i$ ៖", a: "$\\frac{\\pi}{6}+2k\\pi$" },
            { q: "អាគុយម៉ង់នៃ $z=-3$ ៖", a: "$\\pi+2k\\pi$" },
            { q: "អាគុយម៉ង់នៃ $z=2i$ ៖", a: "$\\frac{\\pi}{2}+2k\\pi$" },
            { q: "អាគុយម៉ង់នៃ $z=-4i$ ៖", a: "$-\\frac{\\pi}{2}+2k\\pi$" },
            { q: "អាគុយម៉ង់នៃ $z=\\sqrt{3}-i$ ៖", a: "$-\\frac{\\pi}{6}+2k\\pi$" },
            { q: "អាគុយម៉ង់នៃ $z=-\\sqrt{3}-i$ ៖", a: "$-\\frac{5\\pi}{6}+2k\\pi$" },
            { q: "ចូរបង្កើត $z$ ដែល $|z|=2\\sqrt{2}$ និង $\\arg z=\\frac{3\\pi}{4}+2k\\pi$ ៖", a: "$z=-2+2i$" },

            // Part 8: ទម្រង់ត្រីកោណមាត្រនៃចំនួនកុំផ្លិច
            { q: "ទម្រង់ត្រីកោណមាត្រនៃ $z \\neq 0$ គឺ ៖", a: "$z=r(\\cos\\theta+i\\sin\\theta)$" },
            { q: "ពីទម្រង់ត្រីកោណមាត្រមកពីជគណិត $z=a+bi$ គេប្រើ ៖", a: "$a=r\\cos\\theta$ និង $b=r\\sin\\theta$" },
            { q: "សរសេរ $z=1+i$ ជាទម្រង់ត្រីកោណមាត្រ ៖", a: "$\\sqrt{2}(\\cos\\frac{\\pi}{4}+i\\sin\\frac{\\pi}{4})$" },
            { q: "សរសេរ $z=1-i\\sqrt{3}$ ជាទម្រង់ត្រីកោណមាត្រ ៖", a: "$2(\\cos(-\\frac{\\pi}{3})+i\\sin(-\\frac{\\pi}{3}))$" },
            { q: "សរសេរ $z=-2+2i$ ជាទម្រង់ត្រីកោណមាត្រ ៖", a: "$2\\sqrt{2}(\\cos\\frac{3\\pi}{4}+i\\sin\\frac{3\\pi}{4})$" },
            { q: "សរសេរ $z=-1-i$ ជាទម្រង់ត្រីកោណមាត្រ ៖", a: "$\\sqrt{2}(\\cos(-\\frac{3\\pi}{4})+i\\sin(-\\frac{3\\pi}{4}))$" },
            { q: "សរសេរ $z=\\sqrt{3}+i$ ជាទម្រង់ត្រីកោណមាត្រ ៖", a: "$2(\\cos\\frac{\\pi}{6}+i\\sin\\frac{\\pi}{6})$" },
            { q: "សរសេរ $z=-2$ ជាទម្រង់ត្រីកោណមាត្រ ៖", a: "$2(\\cos\\pi+i\\sin\\pi)$" },
            { q: "សរសេរ $z=3$ ជាទម្រង់ត្រីកោណមាត្រ ៖", a: "$3(\\cos 0+i\\sin 0)$" },
            { q: "សរសេរ $z=2i$ ជាទម្រង់ត្រីកោណមាត្រ ៖", a: "$2(\\cos\\frac{\\pi}{2}+i\\sin\\frac{\\pi}{2})$" },
            { q: "សរសេរ $z=-i$ ជាទម្រង់ត្រីកោណមាត្រ ៖", a: "$\\cos(-\\frac{\\pi}{2})+i\\sin(-\\frac{\\pi}{2})$" },
            { q: "សរសេរ $z=4(\\cos\\frac{\\pi}{6}+i\\sin\\frac{\\pi}{6})$ ជាទម្រង់ពីជគណិត ៖", a: "$2\\sqrt{3}+2i$" },
            { q: "តំលៃ $r$ ក្នុង $z=r(\\cos\\theta+i\\sin\\theta)$ ជា ៖", a: "ម៉ូឌុលនៃ $z$" },
            { q: "តំលៃ $\\theta$ ក្នុង $z=r(\\cos\\theta+i\\sin\\theta)$ ជា ៖", a: "អាគុយម៉ង់នៃ $z$" },
            { q: "ចូរបង្កើតទម្រង់ត្រីកោណមាត្រនៃ $z$ ដែល $|z|=2, Re(z)=1, Im(z)>0$ ៖", a: "$2(\\cos\\frac{\\pi}{3}+i\\sin\\frac{\\pi}{3})$" },

            // Part 9: ផលគុណតាមទម្រង់ត្រីកោណមាត្រ
            { q: "$z_1 z_2$ ស្មើនឹង ៖", a: "$r_1 r_2[\\cos(\\theta_1+\\theta_2)+i\\sin(\\theta_1+\\theta_2)]$" },
            { q: "ម៉ូឌុលនៃ $z_1 z_2$ ស្មើនឹង ៖", a: "$r_1 r_2$" },
            { q: "អាគុយម៉ង់នៃ $z_1 z_2$ ស្មើនឹង ៖", a: "$\\theta_1+\\theta_2$" },
            { q: "ដើម្បីគុណចំនួនកុំផ្លិចទម្រង់ពីជគណិតតាមរូបមន្តទម្រង់ត្រីកោណមាត្រ ត្រូវ ៖", a: "បំប្លែងទៅទម្រង់ត្រីកោណមាត្រជាមុន រួចទើបគុណ" },
            { q: "ផលគុណចំនួនកុំផ្លិចមានន័យធរណីមាត្រថា ៖", a: "គុណប្រវែង និងបូកមុំ" },
            { q: "ចំពោះផលគុណបីចំនួនកុំផ្លិច គេ ៖", a: "គុណម៉ូឌុលទាំងបី និងបូកអាគុយម៉ង់ទាំងបី" },
            { q: "គណនា $2(\\cos\\frac{\\pi}{6}+...) \\times 3(\\cos\\frac{\\pi}{3}+...)$ ៖", a: "$6(\\cos\\frac{\\pi}{2}+i\\sin\\frac{\\pi}{2})$" },
            { q: "គណនា $\\sqrt{2}(\\cos\\frac{\\pi}{4}+...) \\times 5(\\cos\\frac{3\\pi}{4}+...)$ ៖", a: "$5\\sqrt{2}(\\cos\\pi+i\\sin\\pi)$" },
            { q: "គណនា $4(\\cos\\frac{2\\pi}{3}+...) \\times \\frac{1}{2}(\\cos\\frac{\\pi}{6}+...)$ ៖", a: "$2(\\cos\\frac{5\\pi}{6}+i\\sin\\frac{5\\pi}{6})$" },
            { q: "គណនា $3(\\cos 20^{\\circ}+...) \\times 2(\\cos 40^{\\circ}+...)$ ៖", a: "$6(\\cos 60^{\\circ}+i\\sin 60^{\\circ})$" },
            { q: "បើ $z_1=1+i, z_2=-1+i\\sqrt{3}$, គណនា $z_1 z_2$ ជាទម្រង់ត្រីកោណមាត្រ ៖", a: "$2\\sqrt{2}(\\cos\\frac{11\\pi}{12}+i\\sin\\frac{11\\pi}{12})$" },
            { q: "គណនា $z=[2(\\cos\\frac{\\pi}{10}+...)][\\cos\\frac{\\pi}{5}+...][3(\\cos\\frac{\\pi}{2}+...)]$ ៖", a: "$6(\\cos\\frac{4\\pi}{5}+i\\sin\\frac{4\\pi}{5})$" },
            { q: "គណនា $z_1 z_2$ ជាទម្រង់ពីជគណិត បើ $z_1=6(\\cos\\frac{5\\pi}{12}+...), z_2=2(\\cos\\frac{\\pi}{12}+...)$ ៖", a: "$12i$" },
            { q: "បើ $z=2(\\cos\\frac{\\pi}{6}+i\\sin\\frac{\\pi}{6})$, នោះ $z^2$ ស្មើនឹង ៖", a: "$4(\\cos\\frac{\\pi}{3}+i\\sin\\frac{\\pi}{3})$" },
            { q: "បើ $z_1=2(\\cos\\frac{\\pi}{3}+...)$ ។ រក $z_2$ ដើម្បី $z_1 z_2=6(\\cos\\pi+i\\sin\\pi)$ ៖", a: "$3(\\cos\\frac{2\\pi}{3}+i\\sin\\frac{2\\pi}{3})$" },

            // Part 10: ផលចែកតាមទម្រង់ត្រីកោណមាត្រ
            { q: "ផលចែក $\\frac{z_1}{z_2}$ ស្មើនឹង ៖", a: "$\\frac{r_1}{r_2}[\\cos(\\theta_1-\\theta_2)+i\\sin(\\theta_1-\\theta_2)]$" },
            { q: "ម៉ូឌុលនៃ $\\frac{z_1}{z_2}$ ស្មើនឹង ៖", a: "$\\frac{r_1}{r_2}$" },
            { q: "អាគុយម៉ង់នៃ $\\frac{z_1}{z_2}$ ស្មើនឹង ៖", a: "$\\theta_1-\\theta_2$" },
            { q: "រូបមន្តផលចែកកំណត់បានលុះត្រាតែ ៖", a: "$z_2 \\neq 0$" },
            { q: "ផលចែកចំនួនកុំផ្លិចមានន័យធរណីមាត្រថា ៖", a: "ចែកប្រវែង និងដកមុំ" },
            { q: "$\\frac{1}{r(\\cos\\theta+i\\sin\\theta)}$ ស្មើនឹង ៖", a: "$\\frac{1}{r}[\\cos(-\\theta)+i\\sin(-\\theta)]$" },
            { q: "គណនា $\\frac{6(\\cos\\frac{\\pi}{2}+...)}{2(\\cos\\frac{\\pi}{6}+...)}$ ៖", a: "$3(\\cos\\frac{\\pi}{3}+i\\sin\\frac{\\pi}{3})$" },
            { q: "គណនា $\\frac{10(\\cos\\frac{3\\pi}{4}+...)}{5(\\cos\\frac{\\pi}{4}+...)}$ ៖", a: "$2(\\cos\\frac{\\pi}{2}+i\\sin\\frac{\\pi}{2})$" },
            { q: "គណនា $\\frac{\\sqrt{8}(\\cos\\frac{\\pi}{3}+...)}{\\sqrt{2}(\\cos\\frac{5\\pi}{6}+...)}$ ៖", a: "$2[\\cos(-\\frac{\\pi}{2})+i\\sin(-\\frac{\\pi}{2})]$" },
            { q: "គណនា $\\frac{4(\\cos 75^{\\circ}+...)}{2(\\cos 15^{\\circ}+...)}$ ៖", a: "$2(\\cos 60^{\\circ}+i\\sin 60^{\\circ})$" },
            { q: "បើ $z_1=6(\\cos\\frac{5\\pi}{12}+...), z_2=2(\\cos\\frac{\\pi}{12}+...)$ គណនា $\\frac{z_1}{z_2}$ ជាទម្រង់ត្រីកោណមាត្រ ៖", a: "$3(\\cos\\frac{\\pi}{3}+i\\sin\\frac{\\pi}{3})$" },
            { q: "រកទម្រង់ពីជគណិតនៃ $\\frac{2(\\cos\\frac{\\pi}{2}+i\\sin\\frac{\\pi}{2})}{\\cos\\frac{\\pi}{6}+i\\sin\\frac{\\pi}{6}}$ ៖", a: "$1+i\\sqrt{3}$" },
            { q: "គណនា $\\frac{i}{\\frac{\\sqrt{3}}{2}+i\\frac{1}{2}}$ ៖", a: "$\\frac{1}{2}+i\\frac{\\sqrt{3}}{2}$" },
            { q: "បើ $w=2(\\cos\\frac{\\pi}{3}+...)$ និង $\\frac{z_1}{z_2} = w$, តើ $\\frac{1}{w}$ ស្មើនឹង ៖", a: "$\\frac{1}{2}[\\cos(-\\frac{\\pi}{3})+i\\sin(-\\frac{\\pi}{3})]$" },
            { q: "បើ $z_2=3(\\cos\\frac{\\pi}{6}+...)$ ។ រក $z_1$ ដើម្បី $\\frac{z_1}{z_2}=2(\\cos\\frac{\\pi}{2}+...)$ ៖", a: "$6(\\cos\\frac{2\\pi}{3}+i\\sin\\frac{2\\pi}{3})$" },

            // Part 11: បំប្លែងវិលក្នុងប្លង់កុំផ្លិច
            { q: "ចំណុច $M'(z')$ ជារូបភាព $M(z)$ តាមបំប្លែងវិលផ្ចិត $O$ មុំ $\\alpha$ លុះត្រាតែ ៖", a: "$z'=(\\cos\\alpha+i\\sin\\alpha)z$" },
            { q: "តាមបំប្លែងវិលផ្ចិត $O$ មុំ $\\alpha$, ម៉ូឌុលមានលក្ខណៈ ៖", a: "$|z'|=|z|$" },
            { q: "តាមបំប្លែងវិលផ្ចិត $O$ មុំ $\\alpha$, អាគុយម៉ង់មានលក្ខណៈ ៖", a: "$\\arg z' = \\arg z + \\alpha$" },
            { q: "បំប្លែងវិលផ្ចិត $O$ មុំ $\\alpha > 0$ ជាការវិល ៖", a: "ផ្ទុយទ្រនិចនាឡិកា" },
            { q: "បំប្លែងវិលផ្ចិត $O$ មុំ $\\alpha < 0$ ជាការវិល ៖", a: "តាមទ្រនិចនាឡិកា" },
            { q: "វិលផ្ចិត $O$ មុំ $\\pi/2$ រូបភាព $z'$ ស្មើនឹង ៖", a: "$iz$" },
            { q: "បើចំណុច $M'(z')$ ជារូបភាពនៃ $M(z)$ តាមបំប្លែងវិលផ្ចិត $O$ មុំ $\\alpha$ នោះ $M'$ ស្ថិតនៅលើ ៖", a: "រង្វង់ផ្ចិត $O$ កាំ $OM$" },
            { q: "វិលផ្ចិត $O$ មុំ $\\pi$, រូបភាព $M'$ និង $M$ ឆ្លុះគ្នាធៀបនឹង ៖", a: "គល់ $O$" },
            { q: "វិលផ្ចិត $O$ មុំ $-\\pi/2$, រូបភាព $z'$ ស្មើនឹង ៖", a: "$-iz$" },
            { q: "រូបភាពនៃ $z=2i$ តាមបំប្លែងវិលផ្ចិត $O$ មុំ $\\pi/2$ ៖", a: "$-2$" },
            { q: "រូបភាពនៃ $z=1+i$ តាមបំប្លែងវិលផ្ចិត $O$ មុំ $\\pi/4$ ៖", a: "$\\sqrt{2}i$" },
            { q: "រូបភាពនៃ $z=4$ តាមបំប្លែងវិលផ្ចិត $O$ មុំ $\\pi/3$ ៖", a: "$2+2i\\sqrt{3}$" },
            { q: "រូបភាពនៃ $z=2-i$ តាមបំប្លែងវិលផ្ចិត $O$ មុំ $-\\pi/2$ ៖", a: "$-1-2i$" },
            { q: "តើបំប្លែងវិលផ្ចិត $O$ មុំប៉ុន្មាន $(k \\in \\mathbb{Z})$ ដែលបំប្លែង $z=1+i$ ទៅជា $z'=-1+i$ ?", a: "$\\frac{\\pi}{2}+2k\\pi$" },
            { q: "ចូរបង្កើត $z$ ដើម្បីរូបភាពតាមវិល $O$ មុំ $\\pi/2$ គឺ $z'=1+i$ ៖", a: "$1-i$" },

            // Part 12: រូបមន្តដឺម័រ និងស្វ័យគុណទី n
            { q: "រូបមន្តដឺម័រ ចំពោះគ្រប់ចំនួនគត់ធម្មជាតិ $n$ គឺ ៖", a: "$(\\cos\\theta+i\\sin\\theta)^n = \\cos n\\theta+i\\sin n\\theta$" },
            { q: "បើ $z=r(\\cos\\theta+i\\sin\\theta)$ នោះ $z^n$ ស្មើនឹង ៖", a: "$r^n(\\cos n\\theta+i\\sin n\\theta)$" },
            { q: "ម៉ូឌុលនៃ $z^n$ គឺ ៖", a: "$r^n$" },
            { q: "អាគុយម៉ង់នៃ $z^n$ គឺ ៖", a: "$n\\theta$" },
            { q: "បើ $z=\\cos\\theta+i\\sin\\theta$ រាល់ការគុណនឹង $z$ ម្តងៗ ចំណុចរូបភាព ៖", a: "វិលជុំវិញ $O$ មុំ $\\theta$ ហើយម៉ូឌុលនៅដដែល" },
            { q: "កន្សោម $(\\cos\\theta+i\\sin\\theta)^{-n}$ ស្មើនឹង ៖", a: "$\\cos n\\theta-i\\sin n\\theta$" },
            { q: "គណនា $(\\cos\\frac{\\pi}{6}+i\\sin\\frac{\\pi}{6})^3$ ៖", a: "$i$" },
            { q: "គណនា $[2(\\cos\\frac{\\pi}{4}+i\\sin\\frac{\\pi}{4})]^4$ ៖", a: "$-16$" },
            { q: "គណនា $[\\sqrt{2}(\\cos\\frac{\\pi}{12}+i\\sin\\frac{\\pi}{12})]^6$ ៖", a: "$8i$" },
            { q: "គណនា $(1+i)^6$ ៖", a: "$-8i$" },
            { q: "គណនា $(\\sqrt{3}+i)^6$ ៖", a: "$-64$" },
            { q: "បើ $z=\\cos\\frac{\\pi}{3}+i\\sin\\frac{\\pi}{3}$ នោះ $z^2$ ស្មើនឹង ៖", a: "$\\cos\\frac{2\\pi}{3}+i\\sin\\frac{2\\pi}{3}$" },
            { q: "គណនា $(\\cos\\frac{\\pi}{6}+i\\sin\\frac{\\pi}{6})^{-2}$ ៖", a: "$\\frac{1}{2}-i\\frac{\\sqrt{3}}{2}$" },
            { q: "គណនា $(1-i)^4$ ៖", a: "$-4$" },
            { q: "ចូរបង្កើត $z$ ដែល $|z|=2$ និង $z^3=8i$ ៖", a: "$2(\\cos\\frac{\\pi}{6}+i\\sin\\frac{\\pi}{6})$" },

            // Part 13: ឫសទី n នៃចំនួនកុំផ្លិច
            { q: "ឫសទី $n$ នៃ $z=r(\\cos\\theta+i\\sin\\theta)$ គឺ ៖", a: "$w_k = \\sqrt[n]{r}[\\cos\\frac{\\theta+2k\\pi}{n}+i\\sin\\frac{\\theta+2k\\pi}{n}]$" },
            { q: "តម្លៃ $k$ ក្នុងរូបមន្តឫសទី $n$ គឺ ៖", a: "$k=0,1,...,n-1$" },
            { q: "ចំនួនឫសទី $n$ ផ្សេងគ្នានៃ $z \\neq 0$ គឺ ៖", a: "$n$" },
            { q: "ម៉ូឌុលនៃឫសនីមួយៗគឺ ៖", a: "$\\sqrt[n]{r}$" },
            { q: "ឫសពីរជាប់គ្នាក្នុងប្លង់កុំផ្លិចនៅឆ្ងាយគ្នាមុំ ៖", a: "$\\frac{2\\pi}{n}$" },
            { q: "ឫសទាំងអស់ស្ថិតនៅលើ ៖", a: "រង្វង់ផ្ចិត $O$ កាំ $\\sqrt[n]{r}$" },
            { q: "ឫសទី 3 ទាំងបីនៃ $z\\neq 0$ ជាកំពូលនៃ ៖", a: "ត្រីកោណសម" },
            { q: "បើ $w_0, w_1$ ជាឫសការេនៃ $z\\neq 0$ នោះ ៖", a: "$w_1 = -w_0$" },
            { q: "ចំនួនណាជាឫសទី 3 នៃ 1 ?", a: "$-\\frac{1}{2}+i\\frac{\\sqrt{3}}{2}$" },
            { q: "រកឫសការេ $w_0 (k=0)$ នៃ $z=i$ ៖", a: "$\\frac{\\sqrt{2}}{2}+i\\frac{\\sqrt{2}}{2}$" },
            { q: "រកឫសការេ $w_0 (k=0)$ នៃ $4(\\cos\\frac{\\pi}{3}+i\\sin\\frac{\\pi}{3})$ ៖", a: "$2(\\cos\\frac{\\pi}{6}+i\\sin\\frac{\\pi}{6})$" },
            { q: "រកឫសទី 3 $w_0 (k=0)$ នៃ $8(\\cos\\frac{\\pi}{2}+i\\sin\\frac{\\pi}{2})$ ៖", a: "$2(\\cos\\frac{\\pi}{6}+i\\sin\\frac{\\pi}{6})$" },
            { q: "រកឫសការេ $w_0 (k=0)$ នៃ $z=1+i\\sqrt{3}$ ៖", a: "$\\frac{\\sqrt{6}+i\\sqrt{2}}{2}$" },
            { q: "រកឫសទី 4 $w_1 (k=1)$ នៃ $z=-16$ ៖", a: "$-\\sqrt{2}+i\\sqrt{2}$" },
            { q: "ចូរបង្កើតសមីការដែលឫសរបស់វាជាកំពូលនៃការេ ចារឹកក្នុងរង្វង់ផ្ចិត $O$ កាំ $2$ ៖", a: "$w^4=16$" }
        ];

        // 2. State & DOM References
        let currentIndex = 0;
        const totalCards = flashcards.length;

        const cardContainer = document.getElementById('flashcard');
        const cardInner = document.getElementById('card-inner');
        
        const qNumEl = document.getElementById('question-number');
        const qTextEl = document.getElementById('question-text');
        const aTextEl = document.getElementById('answer-text');
        const counterEl = document.getElementById('counter');
        
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // 3. Application Logic
        function triggerMathJax() {
            if (window.MathJax && window.mathjaxReady) {
                // Tell MathJax to clear its internal state for these specific elements and re-typeset
                MathJax.typesetPromise([qTextEl, aTextEl]).catch(function (err) {
                    console.error('MathJax typeset failed: ' + err.message);
                });
            }
        }

        function updateCardContent(index) {
            const card = flashcards[index];
            
            // Set text content
            qNumEl.innerHTML = `សំណួរទី ${index + 1}`; // "Question X" in Khmer
            qTextEl.innerHTML = card.q;
            aTextEl.innerHTML = card.a;
            
            // Update Progress Counter
            counterEl.innerHTML = `Card ${index + 1} of ${totalCards}`;

            // Update button states
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === totalCards - 1;

            // Typeset new content
            triggerMathJax();
        }

        function navigateTo(newIndex) {
            if (newIndex < 0 || newIndex >= totalCards) return;

            // If the card is currently showing the answer (flipped), unflip it first.
            if (cardInner.classList.contains('flipped')) {
                cardInner.classList.remove('flipped');
                
                // Wait for the flip animation to hide the backface before changing the text
                setTimeout(() => {
                    currentIndex = newIndex;
                    updateCardContent(currentIndex);
                }, 250); // half of the 0.5s transition
            } else {
                // If it's already on the question side, update immediately
                currentIndex = newIndex;
                updateCardContent(currentIndex);
            }
        }

        // 4. Event Listeners
        
        // Flip Card
        cardContainer.addEventListener('click', () => {
            cardInner.classList.toggle('flipped');
        });

        // Previous Button
        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // prevent flipping when clicking nav buttons
            navigateTo(currentIndex - 1);
        });

        // Next Button
        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            navigateTo(currentIndex + 1);
        });

        // Keyboard navigation support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                if (currentIndex < totalCards - 1) navigateTo(currentIndex + 1);
            } else if (e.key === 'ArrowLeft') {
                if (currentIndex > 0) navigateTo(currentIndex - 1);
            } else if (e.key === 'Enter') {
                cardInner.classList.toggle('flipped');
            }
        });

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            updateCardContent(currentIndex);
        });

    </script>
</body>
</html>
